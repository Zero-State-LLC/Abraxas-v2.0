[pytest]
# Keep this file as the operational override for known blocker handling and
# collection behavior. Core project-wide pytest defaults live in pyproject.toml.
addopts = -qq --maxfail=1 --tb=short --strict-markers
testpaths = tests
python_files = test_*.py *_test.py
# Markers are explicit in test files; nothing is inferred from path words.
markers =
    slow: measured long-running test file or benchmark; excluded from fast CI, runs in the full suite
    integration: needs an external checkout or service; excluded from fast CI
    sigil_forge_live: needs a Zero-State-LLC/Sigil-Forge checkout (SIGIL_FORGE_HOME or ~/Sigil-Forge); skipped when absent, fails when ABRAXAS_REQUIRE_SIGIL_FORGE=1

# Bypass known collection blocker for advisory/fast paths
filterwarnings = ignore::pytest.PytestCollectionWarning
xfail_strict = true

norecursedirs = __pycache__ .git
