[pytest]
# Keep this file as the operational override for known blocker handling and
# collection behavior. Core project-wide pytest defaults live in pyproject.toml.
addopts = -q --tb=no
testpaths = tests
python_files = test_*.py *_test.py
markers =
    slow: long-running deterministic suites reserved for canon validation
    artifact: generated artifact and drift validation surfaces
    temporal: temporal continuity tests (known collection blocker)
    viz: visualization tests (known collection blocker)
    integration: integration-scoped surfaces (auto-marked by path keywords in conftest)
    canon: canon / temporal continuity surfaces (auto-marked by path keywords in conftest)
    security: security / audit path surfaces (auto-marked by path keywords in conftest)

# Bypass known collection blocker for advisory/fast paths
filterwarnings = ignore::pytest.PytestCollectionWarning
xfail_strict = false

# Default to skipping broken suites for fast verification
# Full suite only run on canon validation paths (run_fast_ci.py with explicit flags)
norecursedirs = temporal viz __pycache__ .git
