<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Abraxas mark">
  <title>Abraxas</title>
  <desc>Geometric mark: ordered lattice emerging from a central node — engineering glyph, not occult.</desc>
  <rect width="64" height="64" rx="12" fill="#0B1020"/>
  <!-- outer lattice -->
  <g fill="none" stroke="#243049" stroke-width="1.25" stroke-linecap="round">
    <path d="M12 20 L32 8 L52 20 L52 44 L32 56 L12 44 Z"/>
    <path d="M22 26 L32 20 L42 26 L42 38 L32 44 L22 38 Z"/>
  </g>
  <!-- ordered edges -->
  <g fill="none" stroke="#00D4F5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 14 L44 22"/>
    <path d="M32 14 L20 22"/>
    <path d="M44 22 L44 42"/>
    <path d="M20 22 L20 42"/>
    <path d="M20 42 L32 50"/>
    <path d="M44 42 L32 50"/>
    <path d="M32 14 L32 50"/>
    <path d="M20 22 L44 42"/>
    <path d="M44 22 L20 42"/>
  </g>
  <!-- core node -->
  <circle cx="32" cy="32" r="4.5" fill="#0B1020" stroke="#00D4F5" stroke-width="1.75"/>
  <circle cx="32" cy="32" r="1.75" fill="#00D4F5"/>
  <!-- secondary accent nodes -->
  <circle cx="32" cy="14" r="2" fill="#5B6CFF"/>
  <circle cx="44" cy="42" r="2" fill="#5B6CFF"/>
  <circle cx="20" cy="42" r="2" fill="#5B6CFF"/>
</svg>
