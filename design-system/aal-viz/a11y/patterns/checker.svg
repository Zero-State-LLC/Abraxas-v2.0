<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Checker pattern">
  <title>Checker pattern</title>
  <defs>
    <pattern id="checker" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="currentColor" opacity="0.55"/>
      <rect x="4" y="4" width="4" height="4" fill="currentColor" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="24" height="24" fill="url(#checker)" stroke="currentColor" stroke-width="1"/>
</svg>
