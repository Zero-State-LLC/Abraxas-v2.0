<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Shadow register fill pattern">
  <title>Shadow register fill pattern</title>
  <defs>
    <pattern id="shadow_fill" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="4" stroke="currentColor" stroke-width="1" opacity="0.7"/>
    </pattern>
  </defs>
  <rect width="24" height="24" fill="url(#shadow_fill)" stroke="currentColor" stroke-width="1"/>
</svg>
