<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Vertical stripes">
  <title>Vertical stripes</title>
  <defs>
    <pattern id="stripes_vertical" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="1" y1="0" x2="1" y2="4" stroke="currentColor" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="24" height="24" fill="url(#stripes_vertical)" stroke="currentColor" stroke-width="1"/>
</svg>
