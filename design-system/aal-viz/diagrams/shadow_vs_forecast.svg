<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="SHADOW versus FORECAST diagram">
  <title>SHADOW versus FORECAST diagram</title>
  <desc>AAL-Viz documentation visual. Projection only. Not a live dashboard screenshot.</desc>
  <rect width="960" height="540" fill="#0B1020"/>
  <text x="24" y="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.16em" fill="#F59E0B">CONCEPT VISUAL</text>
  <text x="24" y="48" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="22" font-weight="600" fill="#E8EEF7">SHADOW versus FORECAST — separate lanes</text>
  <rect x="80" y="160" width="320" height="200" rx="6" fill="#121A2A" stroke="#64748B" stroke-width="1.5"/>
  <text x="90" y="264" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#E8EEF7"></text>
  <text x="100" y="200" font-size="16" font-weight="600" fill="#64748B" font-family="IBM Plex Sans, system-ui, sans-serif">SHADOW</text>
  <text x="100" y="240" font-size="12" fill="#E8EEF7" font-family="IBM Plex Mono, monospace">advisory · fail-open</text>
  <text x="100" y="270" font-size="12" fill="#E8EEF7" font-family="IBM Plex Mono, monospace">no canon blend</text>
  <rect x="520" y="160" width="320" height="200" rx="6" fill="#121A2A" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="530" y="264" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#E8EEF7"></text>
  <text x="540" y="200" font-size="16" font-weight="600" fill="#A78BFA" font-family="IBM Plex Sans, system-ui, sans-serif">FORECAST</text>
  <text x="540" y="240" font-size="12" fill="#E8EEF7" font-family="IBM Plex Mono, monospace">dashed · non-canonical</text>
  <text x="540" y="270" font-size="12" fill="#E8EEF7" font-family="IBM Plex Mono, monospace">never solid cyan</text>
  <text x="420" y="260" font-size="20" fill="#EF4444" font-family="IBM Plex Sans, system-ui, sans-serif">≠</text>
  <text x="24" y="524" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.1em" fill="#64748B">NO VISUAL BLENDING · PROJECTION ONLY</text>
  <rect x="0" y="0" width="960" height="3" fill="#00D4F5"/>
</svg>
