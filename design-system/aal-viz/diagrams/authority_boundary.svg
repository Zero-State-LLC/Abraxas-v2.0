<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="AAL-Viz authority-boundary diagram">
  <title>AAL-Viz authority-boundary diagram</title>
  <desc>AAL-Viz documentation visual. Projection only. Not a live dashboard screenshot.</desc>
  <rect width="960" height="540" fill="#0B1020"/>
  <text x="24" y="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.16em" fill="#F59E0B">IMPLEMENTED SYSTEM MAP</text>
  <text x="24" y="48" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="22" font-weight="600" fill="#E8EEF7">AAL-Viz authority boundary</text>
  <rect x="40" y="120" width="260" height="280" rx="6" fill="#121A2A" stroke="#00D4F5" stroke-width="1.5"/>
  <text x="50" y="264" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#E8EEF7"></text>
  <text x="56" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#00D4F5">MAY READ</text>
  <text x="56" y="180" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Projection bundles</text>
  <text x="56" y="208" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Receipts / artifacts</text>
  <text x="56" y="236" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Topology maps</text>
  <text x="56" y="264" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Evidence refs</text>
  <text x="56" y="292" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Operator queues</text>
  <rect x="350" y="120" width="260" height="280" rx="6" fill="#121A2A" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="360" y="264" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#E8EEF7"></text>
  <text x="366" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2DD4BF">MAY RENDER</text>
  <text x="366" y="180" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Status (non-color)</text>
  <text x="366" y="208" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Topology views</text>
  <text x="366" y="236" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Metrics chrome</text>
  <text x="366" y="264" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Empty/blocked</text>
  <text x="366" y="292" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Export templates</text>
  <rect x="660" y="120" width="260" height="280" rx="6" fill="#121A2A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="670" y="264" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#E8EEF7"></text>
  <text x="676" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#EF4444">NEVER MUTATE</text>
  <text x="676" y="180" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Canon</text>
  <text x="676" y="208" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Activation</text>
  <text x="676" y="236" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Credentials</text>
  <text x="676" y="264" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· External write</text>
  <text x="676" y="292" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EEF7">· Forecast routing</text>
  <text x="24" y="524" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.1em" fill="#64748B">AAL-VIZ · PROJECTION ONLY · NO EXECUTION AUTHORITY</text>
  <rect x="0" y="0" width="960" height="3" fill="#00D4F5"/>
</svg>
