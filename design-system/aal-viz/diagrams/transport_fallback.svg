<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Transport fallback diagram">
  <title>Transport fallback diagram</title>
  <desc>AAL-Viz documentation visual. Projection only. Not a live dashboard screenshot.</desc>
  <rect width="960" height="540" fill="#0B1020"/>
  <text x="24" y="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.16em" fill="#F59E0B">IMPLEMENTED SYSTEM MAP</text>
  <text x="24" y="48" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="22" font-weight="600" fill="#E8EEF7">WebSocket / polling / sample fallback</text>
  <rect x="80" y="180" width="200" height="60" rx="6" fill="#121A2A" stroke="#00D4F5" stroke-width="1.5"/>
  <text x="90" y="214" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#E8EEF7">WebSocket</text>
  <rect x="380" y="180" width="200" height="60" rx="6" fill="#121A2A" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="390" y="214" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#E8EEF7">Polling fallback</text>
  <rect x="680" y="180" width="200" height="60" rx="6" fill="#121A2A" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="690" y="214" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#E8EEF7">Sample fixture</text>
  <path d="M280 210 L380 210" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
  <path d="M374 206 L380 210 L374 214" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
  <path d="M580 210 L680 210" stroke="#64748B" stroke-width="1.5" fill="none"/>
  <path d="M674 206 L680 210 L674 214" stroke="#64748B" stroke-width="1.5" fill="none"/>
  <text x="80" y="300" font-size="12" fill="#64748B" font-family="IBM Plex Mono, monospace">Degrade honestly — never invent live packets</text>
  <text x="24" y="524" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.1em" fill="#64748B">AAL-VIZ · PROJECTION ONLY · NO EXECUTION AUTHORITY</text>
  <rect x="0" y="0" width="960" height="3" fill="#00D4F5"/>
