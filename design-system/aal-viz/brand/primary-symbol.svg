<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AAL-Viz primary symbol">
  <title>AAL-Viz</title>
  <desc>Projection-layer sigil: viewport plane and constellation nodes. Observation only — no authority or execution.</desc>
  <rect width="64" height="64" rx="12" fill="#0B1020"/>
  <!-- projection plane -->
  <path d="M14 42 L32 18 L50 42 Z" fill="none" stroke="#64748B" stroke-width="1.25"/>
  <path d="M18 40 L32 22 L46 40 Z" fill="none" stroke="#00D4F5" stroke-width="1.75"/>
  <!-- observation aperture -->
  <circle cx="32" cy="34" r="5" fill="#0B1020" stroke="#00D4F5" stroke-width="1.75"/>
  <circle cx="32" cy="34" r="1.8" fill="#00D4F5"/>
  <!-- constellation projection nodes (violet = projection register) -->
  <circle cx="22" cy="28" r="1.6" fill="#A78BFA"/>
  <circle cx="42" cy="28" r="1.6" fill="#A78BFA"/>
  <circle cx="32" cy="22" r="1.6" fill="#2DD4BF"/>
  <!-- topology links (thin, advisory) -->
  <path d="M22 28 L32 34 M42 28 L32 34 M32 22 L32 34" stroke="#A78BFA" stroke-width="1" opacity="0.85"/>
</svg>
