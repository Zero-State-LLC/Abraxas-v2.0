<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraxas Real-time Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; background: #0f172a; color: #e2e8f0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: #1e2937; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #2563eb; }
        .log { background: #0f172a; padding: 12px; border-radius: 6px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        .status { padding: 4px 10px; border-radius: 9999px; font-size: 0.875rem; }
        .connected { background: #166534; color: #86efac; }
        .disconnected { background: #7f1d1d; color: #fca5a5; }
        .reconnecting { background: #854d0e; color: #fcd34d; }
        .metric { background: #334155; padding: 12px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Abraxas Real-time Dashboard</h1>

        <div class="card">
            <h3>Live Metrics</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;">
                <div class="metric">
                    <div style="font-size: 0.875rem; color: #94a3b8;">Signals Processed</div>
                    <div id="signals-count" style="font-size: 1.75rem; font-weight: 600;">0</div>
                </div>
                <div class="metric">
                    <div style="font-size: 0.875rem; color: #94a3b8;">Mean Brier</div>
                    <div id="mean-brier" style="font-size: 1.75rem; font-weight: 600;">-</div>
                </div>
                <div class="metric">
                    <div style="font-size: 0.875rem; color: #94a3b8;">Anomalies Detected</div>
                    <div id="anomaly-count" style="font-size: 1.75rem; font-weight: 600;">0</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Connection & Subscription</h3>
            <div>
                <span id="ws-status" class="status disconnected">WebSocket: Disconnected</span>
                <span id="sse-status" class="status disconnected">SSE: Disconnected</span>
            </div>
            <div style="margin: 12px 0;">
                <button onclick="connectWebSocket()">Connect WebSocket</button>
                <button onclick="connectSSE()">Connect SSE</button>
                <button onclick="disconnectAll()">Disconnect All</button>
            </div>

            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #475569;">
                <h4 style="margin-bottom: 8px;">Subscription Filters</h4>
                <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <select id="signal-type-filter">
                        <option value="">All Types</option>
                        <option value="fire">Fire</option>
                        <option value="hantavirus">Hantavirus</option>
                        <option value="chemical">Chemical</option>
                        <option value="protest">Protest</option>
                        <option value="health_outbreak">Health Outbreak</option>
                    </select>
                    <input id="min-severity" type="number" placeholder="Min Severity" step="0.1" min="0" max="1" style="width: 120px;">
                    <button onclick="applySubscription()">Apply Filter</button>
                    <button onclick="clearSubscription()">Clear Filter</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Send Signal</h3>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                <input id="features" type="text" value="0.85, 0.72, 0.41, 0.55" style="width: 260px;">
                <input id="target" type="number" value="0.3" step="0.05" style="width: 80px;">
                <select id="signal-type">
                    <option value="general">General</option>
                    <option value="fire">Fire</option>
                    <option value="hantavirus">Hantavirus</option>
                    <option value="chemical">Chemical</option>
                    <option value="wildfire_smoke">Wildfire Smoke</option>
                    <option value="heatwave">Heatwave</option>
                </select>
                <button onclick="sendSignal()">Send Signal</button>
            </div>
        </div>

        <div class="card">
            <h3>Live Log</h3>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let sse = null;
        let sseReconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 10;
        let lastHeartbeatTime = null;
        let heartbeatCheckInterval = null;
        let signalsProcessed = 0;
        let totalAnomalies = 0;
        let brierScores = [];

        function updateMetrics() {
            document.getElementById('signals-count').textContent = signalsProcessed;
            document.getElementById('anomaly-count').textContent = totalAnomalies;

            if (brierScores.length > 0) {
                const mean = brierScores.reduce((a, b) => a + b, 0) / brierScores.length;
                document.getElementById('mean-brier').textContent = mean.toFixed(4);
            }
        }

        function log(message) {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `[${time}] ${message}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateStatus(type, connected, reconnecting = false) {
            const el = document.getElementById(type + '-status');
            if (reconnecting) {
                el.textContent = type.toUpperCase() + ': Reconnecting...';
                el.className = 'status reconnecting';
            } else if (connected) {
                el.textContent = type.toUpperCase() + ': Connected';
                el.className = 'status connected';
                if (type === 'sse') sseReconnectAttempts = 0;
            } else {
                el.textContent = type.toUpperCase() + ': Disconnected';
                el.className = 'status disconnected';
            }
        }

        function connectWebSocket() {
            if (ws) ws.close();
            ws = new WebSocket('ws://localhost:8000/ws');

            ws.onopen = () => {
                updateStatus('ws', true);
                log('WebSocket connected');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                log('WebSocket: ' + JSON.stringify(data));

                if (data.type === 'signal_result' && data.result) {
                    signalsProcessed++;
                    if (data.result.anomalies && data.result.anomalies.length > 0) {
                        totalAnomalies += data.result.anomalies.length;
                    }
                    if (data.result.brier_score) {
                        brierScores.push(data.result.brier_score);
                        if (brierScores.length > 50) brierScores.shift();
                    }
                    updateMetrics();
                }
            };

            ws.onclose = () => updateStatus('ws', false);
            ws.onerror = () => log('WebSocket error');
        }

        function applySubscription() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Connect WebSocket first');
                return;
            }
            const signalType = document.getElementById('signal-type-filter').value;
            const minSeverity = parseFloat(document.getElementById('min-severity').value);

            const sub = { type: 'subscribe' };
            if (signalType) sub.signal_type = signalType;
            if (!isNaN(minSeverity)) sub.min_severity = minSeverity;

            ws.send(JSON.stringify(sub));
            log('Subscription applied');
        }

        function clearSubscription() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: 'subscribe' }));
            log('Subscription cleared');
        }

        function sendSignal() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket not connected');
                return;
            }
            const features = document.getElementById('features').value.split(',').map(v => parseFloat(v.trim()));
            const target = parseFloat(document.getElementById('target').value);
            const signalType = document.getElementById('signal-type').value;

            ws.send(JSON.stringify({
                type: 'signal',
                features: features,
                target: target,
                signal_type: signalType
            }));
            log('Signal sent');
        }

        function connectSSE() {
            if (sse) sse.close();
            updateStatus('sse', false, true);

            sse = new EventSource('http://localhost:8000/events');

            sse.onopen = () => {
                updateStatus('sse', true);
                lastHeartbeatTime = Date.now();
                startHeartbeatMonitor();
                log('SSE connected');
            };

            sse.onmessage = (event) => {
                lastHeartbeatTime = Date.now();
                log('SSE: ' + event.data);
            };

            sse.addEventListener('heartbeat', () => lastHeartbeatTime = Date.now());

            sse.onerror = () => {
                updateStatus('sse', false, true);
                if (sse) sse.close();
                sseReconnectAttempts++;
                if (sseReconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    const delay = Math.min(1000 * Math.pow(2, sseReconnectAttempts), 30000);
                    setTimeout(() => { if (!sse) connectSSE(); }, delay);
                }
            };
        }

        function startHeartbeatMonitor() {
            if (heartbeatCheckInterval) clearInterval(heartbeatCheckInterval);
            heartbeatCheckInterval = setInterval(() => {
                if (lastHeartbeatTime && sse && (Date.now() - lastHeartbeatTime > 15000)) {
                    log('Heartbeat timeout. Reconnecting...');
                    if (sse) sse.close();
                    sse = null;
                    connectSSE();
                }
            }, 5000);
        }

        function disconnectAll() {
            if (ws) { ws.close(); ws = null; }
            if (sse) { sse.close(); sse = null; }
            if (heartbeatCheckInterval) { clearInterval(heartbeatCheckInterval); heartbeatCheckInterval = null; }
            updateStatus('ws', false);
            updateStatus('sse', false);
            log('All disconnected');
        }
    </script>
</body>
</html>
