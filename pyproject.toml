[project]
name = "abraxas-v2"
# Reference-only package: v2.0 is the doctrine repository and ships no product.
# Doctrine revisions are the v1.N git tags (see VERSION and docs/releases/VERSION_STRATEGY.md);
# the supported Abraxas product is versioned in Zero-State-LLC/Abraxas.
version = "0.0.0+reference"
description = "Governed symbolic execution substrate"
license = { text = "Proprietary" }
authors = [{ name = "Applied Alchemy Labs" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.110,<0.141.2",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
]

[project.scripts]
abraxas = "abraxas.cli:main"

[project.optional-dependencies]
holler = ["requests>=2.32,<3", "requests-cache>=1.2,<2"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "pyright>=1.1,<2",
  "anyio>=4,<5",
  "pip-audit==2.10.1",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "pytest-benchmark>=4.0,<6",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "pyright>=1.1,<2",
  "anyio>=4,<5",
  "pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abraxas", "core"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "contracts"
