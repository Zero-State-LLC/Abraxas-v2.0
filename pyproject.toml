[project]
name = "abraxas-v2"
version = "2.0.1"
description = "Governed symbolic execution substrate"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.110,<0.136.3",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "pyright>=1.1,<2",
  "anyio>=4,<5",
  "pip-audit==2.10.0",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "pyright>=1.1,<2",
  "anyio>=4,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
markers = [
  "slow: long-running deterministic suites reserved for canon validation",
  "integration: integration-level governance surfaces",
  "canon: full canon/continuity validation surfaces",
  "artifact: generated artifact and drift validation surfaces",
  "security: security and audit-heavy validation surfaces",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
