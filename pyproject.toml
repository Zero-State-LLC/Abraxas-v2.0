[project]
name = "abraxas-v2"
version = "2.0.1"
description = "Governed symbolic execution substrate"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pyright",
  "httpx",
  "anyio",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
