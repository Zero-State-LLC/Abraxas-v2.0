[project]
name = "abraxas-v2"
version = "2.5.0"
description = "Governed symbolic execution substrate"
license = { text = "Proprietary" }
authors = [{ name = "Applied Alchemy Labs" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.110,<0.140.1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
]

[project.scripts]
abraxas = "abraxas.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "pyright>=1.1,<2",
  "anyio>=4,<5",
  "pip-audit==2.10.1",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "pytest-benchmark>=4.0,<6",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "pyright>=1.1,<2",
  "anyio>=4,<5",
  "pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
