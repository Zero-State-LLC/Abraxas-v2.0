<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="AAL Core Projection Surface">
  <title>AAL Core Projection Surface</title>
  <rect width="1100" height="400" fill="#0B1020"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <text x="40" y="48" fill="#E8EEF7" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="26" font-weight="600">AAL Core Projection Surface</text>
  <text x="40" y="72" fill="#94A3B8" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="0.08em">ABRAXAS VISUAL OS · EVIDENCE-ORIENTED · NOT PRODUCTION ACTIVATION</text>

  <rect x="100" y="130" width="220" height="90" rx="10" fill="#121A2A" stroke="#5B6CFF" stroke-width="2"/>
  <text x="210.0" y="173.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Projection Bus</text>
  <text x="210.0" y="191.0" fill="#94A3B8" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10">observational</text>
  <rect x="440" y="130" width="220" height="90" rx="10" fill="#121A2A" stroke="#00D4F5" stroke-width="2"/>
  <text x="550.0" y="173.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Runtime Overlay</text>
  <text x="550.0" y="191.0" fill="#94A3B8" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10">tier-1 runtime</text>
  <rect x="780" y="130" width="220" height="90" rx="10" fill="#121A2A" stroke="#C9A227" stroke-width="2"/>
  <text x="890.0" y="173.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Archive Package</text>
  <text x="890.0" y="191.0" fill="#94A3B8" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10">lineage / receipts</text>
  <line x1="320" y1="175" x2="440" y2="175" stroke="#00D4F5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="175" x2="780" y2="175" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="280" fill="#94A3B8" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">Projection is observational; no canon promotion authority is implied.</text>
  <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#94A3B8">
    <rect x="100" y="310" width="14" height="14" fill="none" stroke="#00D4F5" stroke-width="2"/><text x="122" y="321">Tier 1 runtime</text>
    <rect x="260" y="310" width="14" height="14" fill="none" stroke="#C9A227" stroke-width="2"/><text x="282" y="321">Tier 2 governance</text>
    <rect x="440" y="310" width="14" height="14" fill="none" stroke="#5B6CFF" stroke-width="2"/><text x="462" y="321">Tier 3 research</text>
    <rect x="640" y="310" width="14" height="14" fill="none" stroke="#A78BFA" stroke-width="2"/><text x="662" y="321">advisory</text>
  </g>

  <text x="40" y="376" fill="#94A3B8" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="12">Source: design-system tokens · contracts remain fail-closed on authority.</text>
</svg>
