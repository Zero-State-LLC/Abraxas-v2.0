<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-label="Runtime Map">
  <title>Runtime Map</title>
  <rect width="1100" height="380" fill="#0B1020"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <text x="40" y="48" fill="#E8EEF7" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="26" font-weight="600">Runtime Map</text>
  <text x="40" y="72" fill="#94A3B8" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="0.08em">ABRAXAS VISUAL OS · EVIDENCE-ORIENTED · NOT PRODUCTION ACTIVATION</text>

  <rect x="80" y="120" width="200" height="80" rx="10" fill="#121A2A" stroke="#00D4F5" stroke-width="2"/>
  <text x="180.0" y="158.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Ingress</text>
  <rect x="320" y="120" width="200" height="80" rx="10" fill="#121A2A" stroke="#00D4F5" stroke-width="2"/>
  <text x="420.0" y="158.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Pipeline</text>
  <rect x="560" y="120" width="200" height="80" rx="10" fill="#121A2A" stroke="#00D4F5" stroke-width="2"/>
  <text x="660.0" y="158.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Runtime</text>
  <rect x="800" y="120" width="200" height="80" rx="10" fill="#121A2A" stroke="#10B981" stroke-width="2"/>
  <text x="900.0" y="158.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Telemetry</text>
  <line x1="280" y1="160" x2="320" y2="160" stroke="#00D4F5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="160" x2="560" y2="160" stroke="#00D4F5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="160" x2="800" y2="160" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="240" width="200" height="80" rx="10" fill="#121A2A" stroke="#C9A227" stroke-width="2"/>
  <text x="180.0" y="278.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Artifacts</text>
  <rect x="320" y="240" width="200" height="80" rx="10" fill="#121A2A" stroke="#10B981" stroke-width="2"/>
  <text x="420.0" y="278.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Receipts</text>
  <rect x="560" y="240" width="200" height="80" rx="10" fill="#121A2A" stroke="#F59E0B" stroke-width="2"/>
  <text x="660.0" y="278.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Operator HUD</text>
  <rect x="800" y="240" width="200" height="80" rx="10" fill="#121A2A" stroke="#EF4444" stroke-width="2"/>
  <text x="900.0" y="278.0" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Activation</text>
  <text x="900.0" y="296.0" fill="#94A3B8" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10">DENIED</text>
  <line x1="180" y1="200" x2="180" y2="240" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="200" x2="420" y2="240" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="200" x2="660" y2="240" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="200" x2="900" y2="240" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="356" fill="#94A3B8" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="12">Activation surface styled DENIED — visual OS does not grant go-live.</text>
