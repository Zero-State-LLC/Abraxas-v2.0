<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="YGGDRASIL Route Topology">
  <title>YGGDRASIL Route Topology</title>
  <rect width="1100" height="400" fill="#0B1020"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <text x="40" y="48" fill="#E8EEF7" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="26" font-weight="600">YGGDRASIL Route Topology</text>
  <text x="40" y="72" fill="#94A3B8" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="0.08em">ABRAXAS VISUAL OS · EVIDENCE-ORIENTED · NOT PRODUCTION ACTIVATION</text>

  <circle cx="200" cy="220" r="48" fill="#121A2A" stroke="#00D4F5" stroke-width="2"/>
  <text x="200" y="225" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12">ROOT</text>
  <circle cx="420" cy="150" r="40" fill="#121A2A" stroke="#00D4F5" stroke-width="2"/>
  <text x="420" y="155" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">ROUTE</text>
  <circle cx="420" cy="290" r="40" fill="#121A2A" stroke="#A78BFA" stroke-width="2"/>
  <text x="420" y="295" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">SHADOW</text>
  <circle cx="680" cy="150" r="40" fill="#121A2A" stroke="#10B981" stroke-width="2"/>
  <text x="680" y="155" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">RECEIPT</text>
  <circle cx="680" cy="290" r="40" fill="#121A2A" stroke="#5B6CFF" stroke-width="2"/>
  <text x="680" y="295" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">PROJECT</text>
  <circle cx="900" cy="220" r="44" fill="#121A2A" stroke="#C9A227" stroke-width="2"/>
  <text x="900" y="225" fill="#E8EEF7" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">OPERATOR</text>
  <line x1="248" y1="210" x2="380" y2="160" stroke="#00D4F5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="248" y1="230" x2="380" y2="280" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="150" x2="640" y2="150" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="290" x2="640" y2="290" stroke="#5B6CFF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="170" x2="860" y2="210" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="270" x2="860" y2="230" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="376" fill="#94A3B8" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="12">Node colors follow design-system/viz topology palette roles.</text>
</svg>
