version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "scrimshawlife-ctrl"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python (pip / pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "scrimshawlife-ctrl"
    groups:
      python-dependencies:
        patterns:
          - "*"

# Notes:
# - Weekly schedule to reduce noise
# - Human review required (no automerge)
# - Grouping enabled so related updates land in one PR
# - Limited open PRs to maintain focus
