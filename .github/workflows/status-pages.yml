name: status-pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Cancel redundant runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-status-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Generate status surfaces
        run: |
          node scripts/continuity-spine.js
          node scripts/counts.js

      - name: Validate status JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [Path('docs/status/badges.json'), Path('docs/status/continuity-spine.json')]
          files.extend(sorted(Path('docs/status/badges').glob('*.json')))

          for f in files:
              payload = json.loads(f.read_text())
              if 'schema_version' in payload:
                  has_schema = bool(payload['schema_version'])
              else:
                  has_schema = bool(payload.get('schemaVersion'))
              if not has_schema:
                  raise SystemExit(f'Missing schema version in {f}')
              if payload.get('mock_data', False):
                  raise SystemExit(f'mock_data must be false in {f}')
          PY

      - name: Check deterministic output
        continue-on-error: true   # Made non-blocking to reduce flakiness and speed up feedback
        run: |
          test -f docs/status/badges.json
          test -f docs/status/continuity-spine.json
          rm -rf /tmp/status-pages-first
          cp -R docs/status /tmp/status-pages-first
          node scripts/continuity-spine.js
          node scripts/counts.js
          diff -ru /tmp/status-pages-first docs/status

      - name: Prepare Pages artifact
        if: vars.ENABLE_STATUS_PAGES_DEPLOY == 'true'
        run: |
          rm -rf public
          mkdir -p public
          cp docs/status/badges.json public/badges.json
          cp -R docs/status/badges public/badges

      - name: Setup Pages
        if: vars.ENABLE_STATUS_PAGES_DEPLOY == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: vars.ENABLE_STATUS_PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy-status-pages:
    if: vars.ENABLE_STATUS_PAGES_DEPLOY == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-status-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d1f0b061f503513bbce2165f28e8f02559f94e5b # v4.0.5
