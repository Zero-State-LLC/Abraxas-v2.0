name: "CodeQL"

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '23 4 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
          # Disable automatic build detection (often fails on non-standard projects)
          # We will rely on CodeQL's Python extractor instead

      # No autobuild step - using CodeQL's built-in Python analysis
      # This is more reliable for projects with many scripts and custom structure

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:${{ matrix.language }}"
