name: "CodeQL"

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '23 4 * * 3'

jobs:
  analyze:
    name: Analyze
    if: ${{ vars.HOSTED_ACTIONS_AVAILABLE != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          # Disable automatic build detection (often fails on non-standard projects)
          # We will rely on CodeQL's Python extractor instead

      # No autobuild step - using CodeQL's built-in Python analysis
      # This is more reliable for projects with many scripts and custom structure

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
