name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    if: ${{ vars.HOSTED_ACTIONS_AVAILABLE != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # semantic-release@25 requires Node ^22.22.2 || >=24.15 (see package.json engines / lockfile).
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Root package.json pins semantic-release plugins referenced by release.config.js.
        # npm ci must succeed so @semantic-release/* modules resolve under npx.
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
