name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v2.2.0)'
        required: true
        type: string

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header

  create-release:
    needs: generate-changelog
    uses: ./.github/workflows/reusable/create-release.yml
    with:
      version: ${{ github.event.inputs.version }}
      release-body: |
        ${{ needs.generate-changelog.outputs.changelog }}

        ---

        See full history in [CHANGELOG.md](https://github.com/scrimshawlife-ctrl/Abraxas-v2.0/blob/main/CHANGELOG.md).
