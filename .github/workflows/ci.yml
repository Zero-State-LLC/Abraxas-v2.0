name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validation_ref:
        description: 'Optional branch, tag, SHA, or pull request ref to validate'
        required: false
        default: ''
      validation_mode:
        description: 'Validation depth for manual runs'
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  fast-ci:
    name: fast-ci
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Toolchain diagnostics
        run: |
          python --version
          python -m pip --version
          python -m pip list
          python -c "import pytest, ruff; print('tool imports ok')"

      - name: Run fast CI checks
        run: python scripts/run_fast_ci.py

      - name: Generate repository status surfaces
        run: |
          node Scripts/continuity-spine.js
          node Scripts/counts.js

      - name: Validate status JSON surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required_paths = [
              Path("docs/status/badges.json"),
              Path("docs/status/continuity-spine.json"),
          ]

          for p in sorted(Path("docs/status/badges").glob("*.json")):
              required_paths.append(p)

          for file_path in required_paths:
              payload = json.loads(file_path.read_text())
              if "schema_version" in payload:
                  schema_present = bool(payload.get("schema_version"))
              else:
                  schema_present = bool(payload.get("schemaVersion"))
              if not schema_present:
                  raise SystemExit(f"Missing schema_version/schemaVersion in {file_path}")
              if payload.get("mock_data", False):
                  raise SystemExit(f"mock_data must be false in {file_path}")
          PY

      - name: Verify deterministic status output
        run: |
          test -f docs/status/badges.json
          test -f docs/status/continuity-spine.json
          rm -rf /tmp/status-first
          cp -R docs/status /tmp/status-first
          node Scripts/continuity-spine.js
          node Scripts/counts.js
          diff -ru /tmp/status-first docs/status

      - name: P64 manifest source hash gate
        run: python scripts/run_p64_manifest_source_hash_gate.py

  canon-validation:
    name: canon-validation
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'full') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Toolchain diagnostics
        run: |
          python --version
          python -m pip --version
          python -m pip list
          python -c "import pytest, ruff; print('tool imports ok')"

      - name: Full artifact regeneration
        run: python scripts/run_artifact_regeneration.py --full

      - name: Full artifact validation and drift
        run: |
          python scripts/run_artifact_regeneration.py --full --validation-only
          python scripts/run_artifact_regeneration.py --check-drift

      - name: Full test suite
        run: python -m pytest -q

  security-scan:
    name: security-scan
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Detect dependency changes
        if: github.event_name == 'pull_request'
        id: dep_changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deps:
              - 'pyproject.toml'
              - 'requirements*.txt'
              - '**/requirements*.txt'
              - 'poetry.lock'
              - 'uv.lock'

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Toolchain diagnostics
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        run: |
          python --version
          python -m pip --version
          python -m pip list

      - name: Run pip-audit
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        run: python -m pip_audit
