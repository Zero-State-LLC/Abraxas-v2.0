name: ci

on:
  pull_request:
    paths:
      - 'core/**'
      - 'Scripts/**'
      - 'scripts/**'
      - 'apps/aal-viz-live-console/**'
      - 'docs/releases/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'Scripts/**'
      - 'scripts/**'
      - 'apps/aal-viz-live-console/**'
      - 'docs/releases/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      validation_ref:
        description: 'Optional branch, tag, SHA, or pull request ref to validate'
        required: false
        default: ''
      validation_mode:
        description: 'Validation depth for manual runs'
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full
  schedule:
    - cron: '17 4 * * *'

# Cancel in-progress runs on the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-python:
    uses: ./.github/workflows/reusable/python-setup.yml
    with:
      python-version: '3.12'

  fast-ci:
    name: fast-ci
    needs: setup-python
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run fast CI checks
        run: python scripts/run_fast_ci.py

      - name: Rune integrity scanner (report-only)
        continue-on-error: true
        run: python Scripts/run_rune_integrity_scanner_guardrails_receipt.py

  aal-viz-console:
    name: aal-viz-console
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aal-viz-live-console
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: apps/aal-viz-live-console/.nvmrc
          cache: npm
          cache-dependency-path: apps/aal-viz-live-console/package-lock.json

      - name: Install and test
        run: |
          npm ci
          npm test
          npm run build

      # Expected to fail until P52→P57→P64 atomic re-seal under operator lane (P57 hash drift).
      - name: P64 manifest source hash gate
        continue-on-error: true
        run: python scripts/run_p64_manifest_source_hash_gate.py

  canon-validation:
    name: canon-validation
    needs: setup-python
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'full')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Full artifact regeneration
        run: python scripts/run_artifact_regeneration.py --full

      - name: Full artifact validation and drift
        run: |
          python scripts/run_artifact_regeneration.py --full --validation-only
          python scripts/run_artifact_regeneration.py --check-drift

      - name: Full test suite
        run: python -m pytest -q

  security-scan:
    name: security-scan
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Detect dependency changes
        if: github.event_name == 'pull_request'
        id: dep_changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deps:
              - 'pyproject.toml'
              - 'requirements*.txt'
              - '**/requirements*.txt'
              - 'poetry.lock'
              - 'uv.lock'

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run pip-audit
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        run: python -m pip_audit
