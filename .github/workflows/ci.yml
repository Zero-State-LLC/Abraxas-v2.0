name: ci

on:
  pull_request:
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      validation_ref:
        description: 'Optional branch, tag, SHA, or pull request ref to validate'
        required: false
        default: ''
      validation_mode:
        description: 'Validation depth for manual runs'
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full
  schedule:
    - cron: '17 4 * * *'

# Cancel in-progress runs on the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-python:
    uses: ./.github/workflows/reusable/python-setup.yml
    with:
      python-version: '3.12'

  fast-ci:
    name: fast-ci
    needs: setup-python
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Run fast CI checks
        run: python scripts/run_fast_ci.py

      - name: P64 manifest source hash gate
        run: python scripts/run_p64_manifest_source_hash_gate.py

  canon-validation:
    name: canon-validation
    needs: setup-python
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'full')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Full artifact regeneration
        run: python scripts/run_artifact_regeneration.py --full

      - name: Full artifact validation and drift
        run: |
          python scripts/run_artifact_regeneration.py --full --validation-only
          python scripts/run_artifact_regeneration.py --check-drift

      - name: Full test suite
        run: python -m pytest -q

  security-scan:
    name: security-scan
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Detect dependency changes
        if: github.event_name == 'pull_request'
        id: dep_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - 'pyproject.toml'
              - 'requirements*.txt'
              - '**/requirements*.txt'
              - 'poetry.lock'
              - 'uv.lock'

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run pip-audit
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        run: python -m pip_audit
