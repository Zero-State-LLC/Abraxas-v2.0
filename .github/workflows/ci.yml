name: ci

on:
  pull_request:
    paths:
      - 'core/**'
      - 'Scripts/**'
      - 'scripts/**'
      - 'apps/aal-viz-live-console/**'
      - 'docs/releases/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'Scripts/**'
      - 'scripts/**'
      - 'apps/aal-viz-live-console/**'
      - 'docs/releases/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      validation_ref:
        description: 'Optional branch, tag, SHA, or pull request ref to validate'
        required: false
        default: ''
      validation_mode:
        description: 'Validation depth for manual runs'
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full
  schedule:
    - cron: '17 4 * * *'

# Cancel in-progress runs on the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Hosted ubuntu-latest jobs fail immediately when the account spending
# limit or payment is blocked. Set repository variable
# HOSTED_ACTIONS_AVAILABLE=false to skip those jobs without consuming a
# runner. Unset or any other value keeps current behavior.
jobs:
  fast-ci:
    name: fast-ci
    if: ${{ vars.HOSTED_ACTIONS_AVAILABLE != 'false' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run fast CI checks
        run: python scripts/run_fast_ci.py

      - name: Rune integrity scanner (report-only)
        continue-on-error: true
        run: python scripts/operator/run_rune_integrity_scanner_guardrails_receipt.py

  aal-viz-console:
    name: aal-viz-console
    if: ${{ vars.HOSTED_ACTIONS_AVAILABLE != 'false' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aal-viz-live-console
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/aal-viz-live-console/.nvmrc
          cache: npm
          cache-dependency-path: apps/aal-viz-live-console/package-lock.json

      - name: Install and test
        run: |
          npm ci
          npm test
          npm run build

      # Expected to fail until P52→P57→P64 atomic re-seal under operator lane (P57 hash drift).
      - name: P64 manifest source hash gate
        continue-on-error: true
        run: python scripts/viz/run_p64_manifest_source_hash_gate.py

  canon-validation:
    name: canon-validation
    if: ${{ vars.HOSTED_ACTIONS_AVAILABLE != 'false' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'full')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Full artifact regeneration
        run: python scripts/artifact/run_artifact_regeneration.py --full

      - name: Full artifact validation and drift
        run: |
          python scripts/artifact/run_artifact_regeneration.py --full --validation-only
          python scripts/artifact/run_artifact_regeneration.py --check-drift

      - name: Full test suite
        run: python -m pytest -q

  security-scan:
    name: security-scan
    if: ${{ vars.HOSTED_ACTIONS_AVAILABLE != 'false' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_ref || github.ref }}

      - name: Detect dependency changes
        if: github.event_name == 'pull_request'
        id: dep_changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deps:
              - 'pyproject.toml'
              - 'requirements*.txt'
              - '**/requirements*.txt'
              - 'poetry.lock'
              - 'uv.lock'

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run pip-audit
        if: github.event_name != 'pull_request' || steps.dep_changes.outputs.deps == 'true'
        run: python -m pip_audit
