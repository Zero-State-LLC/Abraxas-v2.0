name: Script Organization

on:
  pull_request:
    paths:
      - 'scripts/run_*.py'
      - 'scripts/organize_scripts.py'

permissions:
  contents: read

jobs:
  check-organization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check for unorganized scripts
        run: |
          python scripts/organize_scripts.py dry-run > /tmp/org-check.json
          git diff --name-status "${{ github.event.pull_request.base.sha }}...HEAD" \
            -- 'scripts/run_*.py' \
            | awk '$1 == "A" { print $2 }' \
            | sort > /tmp/changed-run-scripts.txt
          jq -r '.moved[]?.file | "scripts/" + .' /tmp/org-check.json \
            | sort > /tmp/unorganized-run-scripts.txt
          comm -12 /tmp/changed-run-scripts.txt /tmp/unorganized-run-scripts.txt \
            > /tmp/changed-unorganized-run-scripts.txt
          moved_count=$(wc -l < /tmp/changed-unorganized-run-scripts.txt)

          if [ "$moved_count" -gt 0 ]; then
            echo "::error::There are $moved_count changed unorganized runner scripts."
            echo "Run: python scripts/organize_scripts.py execute on a feature branch."
            cat /tmp/changed-unorganized-run-scripts.txt
            exit 1
          fi

          echo "All runner scripts are properly organized."
