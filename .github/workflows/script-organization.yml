name: Script Organization

on:
  pull_request:
    paths:
      - 'scripts/run_*.py'
      - 'scripts/organize_scripts.py'

permissions:
  contents: read

jobs:
  check-organization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Check for unorganized scripts
        run: |
          python scripts/organize_scripts.py --dry-run > /tmp/org-check.json
          moved_count=$(jq '.moved_count' /tmp/org-check.json)

          if [ "$moved_count" -gt 0 ]; then
            echo "::error::There are $moved_count unorganized runner scripts."
            echo "Run: python scripts/organize_scripts.py --execute on a feature branch."
            cat /tmp/org-check.json
            exit 1
          fi

          echo "All runner scripts are properly organized."
